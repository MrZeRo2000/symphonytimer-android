import com.android.build.api.artifact.SingleArtifact

import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
}

android {
    namespace = "com.romanpulov.symphonytimer"

    defaultConfig {
        compileSdk 37
        applicationId "com.romanpulov.symphonytimer"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 14
        versionName "0.11.15"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }

        //rename to debug for debugging with ProGuard rules
        debugTest {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
            minifyEnabled true
            debuggable false
            jniDebuggable false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE']
        }
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        abortOnError false
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The old applicationVariants API was removed in AGP 8+. The new Variant API cannot
// rename the produced APK in place (Studio deploys by the default name), so we copy
// the built release APK to a versioned name under build/outputs/renamed_apk/.
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        def capName = variant.name.substring(0, 1).toUpperCase() + variant.name.substring(1)
        def versionNameProvider = variant.outputs.first().versionName
        def apkDir = variant.artifacts.get(SingleArtifact.APK.INSTANCE)
        def artifactsLoader = variant.artifacts.getBuiltArtifactsLoader()
        // Copy imperatively in doLast rather than via a Copy task: the destination is
        // AGP's own APK output directory, and declaring it as a task output would clash
        // with AGP's downstream tasks that read that directory.
        def copyRenamedApk = tasks.register("copyRenamedApk${capName}") {
            inputs.dir(apkDir)
            doLast {
                def srcFile = new File(artifactsLoader.load(apkDir.get()).elements.first().outputFile)
                def destFile = new File(srcFile.parentFile,
                        "symphony_timer_${versionNameProvider.get().replace('.', '_')}.apk")
                Files.copy(srcFile.toPath(), destFile.toPath(),
                        StandardCopyOption.REPLACE_EXISTING)
                logger.lifecycle("Created renamed APK: ${destFile}")
            }
        }
        // Run the copy automatically after the release APK is assembled.
        tasks.matching { it.name == "assemble${capName}".toString() }.configureEach {
            finalizedBy(copyRenamedApk)
        }
    }
}

dependencies {
    def nav_version = "2.9.8"
    def work_version = "2.11.2"

    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.work:work-runtime:$work_version"

    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"

    implementation 'com.romanpulov.library.common:library:1.3.23'
    implementation 'com.romanpulov.library.msgraph:library:0.0.20'
    implementation 'com.romanpulov.library.gdrive:library:0.1.3'
    implementation 'com.romanpulov.library.view:library:1.1.10'

    // Unit testing dependencies
    androidTestImplementation 'androidx.annotation:annotation:1.10.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    testImplementation 'junit:junit:4.13.2'
}
